# ConfigMap com a identidade/metadados da NF (consumida via envFrom no Deployment).
# A CONFIGURAÇÃO OPERACIONAL (cell_id, plmn_id etc.) fica no /config em runtime da NF,
# demonstrada via Experimento 2 (docs/provisioning-flow.md) — este ConfigMap é a
# "configuração de implantação" (identidade), não a configuração de domínio da NF.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oran-du-identity
  namespace: openran-lab
  labels:
    app: oran-du
data:
  NF_NAME: "oran-du"
  NF_TYPE: "O-DU"
  NF_VERSION: "v1"
  # Config de dominio (o "estado publicado no pacote"). O lab/nephio/config-bridge
  # compara isto com o /config ao vivo da NF e comita uma correcao aqui quando um
  # operador muda a config via API (PUT /config) em vez de via pacote.
  CFG_PLMN_ID: "00101"
  CFG_CELL_ID: "1"
  CFG_TX_POWER_DBM: "20"
  CFG_DU_ID: "1"
