apiVersion: apps/v1
kind: Deployment
metadata:
  name: oran-cu
  namespace: openran-lab
  labels:
    app: oran-cu
    nf-type: O-CU
    workload.nephio.org/represents: network-function
spec:
  # "replicas" deliberadamente OMITIDO: o rapp-autoscale (lab/nephio/rapp-autoscale) e o
  # dono exclusivo deste campo via PATCH no /scale subresource. Se "replicas" estivesse
  # aqui, o RootSync continuo (kpt/Config Sync usam server-side apply) reverteria a
  # decisao do rApp de volta ao valor do Git a cada ciclo de reconciliacao - um conflito
  # real de autoridade entre GitOps declarativo e um controller imperativo de scaling,
  # descoberto e documentado em docs/improvements-16gb.md. Mesmo padrao usado na vida
  # real quando um HPA coexiste com GitOps (Argo CD chama isso de "ignoreDifferences").
  selector:
    matchLabels:
      app: oran-cu
  template:
    metadata:
      labels:
        app: oran-cu
        nf-type: O-CU
      annotations:
        # bump isto no pacote para forcar um novo ReplicaSet (rollout) - mudar
        # so o ConfigMap (envFrom) NAO dispara rollout automatico no Kubernetes.
        openran-lab/nf-version: "v1"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oran-cu
          image: oran-cu:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: oran-cu-identity
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
