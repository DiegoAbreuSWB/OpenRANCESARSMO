apiVersion: apps/v1
kind: Deployment
metadata:
  name: oran-core
  namespace: openran-lab
  labels:
    app: oran-core
    nf-type: 5GC-AMF-sim
    workload.nephio.org/represents: network-function
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oran-core
  template:
    metadata:
      labels:
        app: oran-core
        nf-type: 5GC-AMF-sim
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oran-core
          image: oran-core:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: oran-core-identity
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
