# demo-nf — workload REPRESENTATIVO de uma Network Function.
#
# ATENÇÃO (obrigatório no relatório): demo-nf NÃO representa uma função O-RAN real.
# É um nginx usado apenas para demonstrar mecanismos de lifecycle e orchestration
# (instantiate / scale / update / recover / terminate) sobre o workload cluster
# "o-cloud-1". Não tem planos de controle/usuário, interfaces O-RAN (E1/F1/E2/N2/N3),
# dependências de kernel (SCTP/GTP-U/DPDK) nem operador dedicado.
#
# Aplicar no O-Cloud:
#   kubectl --context o-cloud-1 apply -f manifests/demo-nf.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-nf
  namespace: default
  labels:
    app: demo-nf
    nephio.org/lab: smo-o2ims
    workload.nephio.org/represents: network-function
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-nf
  template:
    metadata:
      labels:
        app: demo-nf
        nephio.org/lab: smo-o2ims
    spec:
      containers:
        - name: demo-nf
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
          env:
            - name: VERSION
              value: "v1"          # alterado para "v2" na ETAPA 10 (update declarativo)
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: demo-nf
  namespace: default
  labels:
    app: demo-nf
spec:
  selector:
    app: demo-nf
  ports:
    - name: http
      port: 80
      targetPort: 80
